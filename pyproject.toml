[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lumiport"
version = "0.1.0"
description = "OpenEdge ABL inventory and Python migration assistant"
requires-python = ">=3.10"
dependencies = ["typer"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
lumiport = "lumiport.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
